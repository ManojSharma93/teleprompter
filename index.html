<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Teleprompter</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1115" />
  <style>
    .landing {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 32px; padding: 24px; text-align: center;
    }
    .landing h1 { font-size: 40px; margin: 0; }
    .landing p { color: var(--fg-muted); max-width: 520px; margin: 0; }
    .landing .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .landing a.btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
    }
    .landing a.primary { background: var(--accent); color: #0f1115; }
    .landing a.ghost { background: var(--bg-3); color: var(--fg); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <main class="landing">
    <h1>Teleprompter</h1>
    <p>Read on your phone or iPad. Control speed, text, and timing from your computer. Works offline once installed.</p>
    <div class="actions">
      <a class="btn primary" href="/control.html">Start session (computer)</a>
      <a class="btn ghost" href="/display.html">Join as display (phone / iPad)</a>
    </div>
  </main>
</body>
</html>
