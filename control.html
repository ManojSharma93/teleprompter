<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teleprompter — Control</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/controller.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1115" />
</head>
<body>
  <div id="login-screen" class="login-shell">
    <div class="login-card">
      <h1>Teleprompter</h1>
      <p class="muted">Choose your account to continue. Your scripts sync to the cloud and follow you on any device.</p>
      <div class="login-buttons">
        <button class="login-btn" data-user="manoj">I'm Manoj</button>
        <button class="login-btn" data-user="krishna">I'm Krishna</button>
      </div>
      <p id="login-status" class="muted" style="min-height:1.2em;"></p>
    </div>
  </div>

  <div class="controller-shell" id="controller-shell" style="display:none;">
    <aside class="controller-sidebar">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <span class="muted">Logged in as <strong id="current-user">-</strong></span>
        <button id="switch-user" class="ghost" style="font-size:12px; padding:4px 10px;">Switch</button>
      </div>
      <hr style="border-color:var(--border); margin:8px 0 16px;" />
      <div class="row" style="justify-content:space-between;">
        <strong>Scripts</strong>
        <button id="new-script" class="ghost">+ New</button>
      </div>
      <div id="script-list" class="script-list" style="margin-top:12px;"></div>
      <hr style="border-color:var(--border); margin:16px 0;" />
      <div class="col">
        <button id="export-all">Export all (JSON)</button>
        <label class="ghost" style="text-align:center;cursor:pointer;border:1px solid var(--border);padding:8px 14px;border-radius:var(--radius);">
          Import JSON
          <input id="import-file" type="file" accept="application/json" style="display:none;" />
        </label>
      </div>
    </aside>

    <main class="controller-main">
      <div class="row" style="justify-content:space-between;">
        <input id="script-name" placeholder="Untitled script" style="max-width:320px;" />
        <div class="row">
          <button id="duplicate-script">Duplicate</button>
          <button id="delete-script">Delete</button>
        </div>
      </div>
      <textarea id="script-content" class="editor-textarea" placeholder="Paste or type your script here..."></textarea>
      <div class="preview-frame" id="preview"></div>
    </main>

    <aside class="controller-rightbar">
      <div class="pair-card" id="pair-card">
        <p class="muted">Open this on your phone or iPad:</p>
        <img id="qr-image" alt="QR code to pair" />
        <p class="pair-code" id="pair-code">------</p>
        <p class="pair-status" id="pair-status">Generating code...</p>
      </div>
      <hr style="border-color:var(--border); margin:16px 0;" />
      <div class="col">
        <label>Speed <span id="speed-val" class="muted">1.0x</span>
          <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1.0" />
        </label>
        <label>Font size <span id="font-val" class="muted">64px</span>
          <input id="font-size" type="range" min="24" max="160" step="2" value="64" />
        </label>
        <label>Line height <span id="line-val" class="muted">1.6</span>
          <input id="line-height" type="range" min="1" max="2.4" step="0.1" value="1.6" />
        </label>
        <label>Margin (camera-center: drag right) <span id="margin-val" class="muted">15%</span>
          <input id="margin" type="range" min="0" max="42" step="1" value="15" />
        </label>
        <label>Theme
          <select id="theme">
            <option value="dark">Dark</option>
            <option value="black">Black (OLED)</option>
            <option value="sepia">Sepia</option>
            <option value="high-contrast">High contrast</option>
            <option value="light">Light</option>
          </select>
        </label>
        <label>Countdown
          <select id="countdown-sec">
            <option value="0">None</option>
            <option value="3" selected>3 sec</option>
            <option value="5">5 sec</option>
            <option value="10">10 sec</option>
          </select>
        </label>
        <label class="row" style="gap:8px;"><input id="mirror" type="checkbox" /> Mirror (reflective rig)</label>
        <p class="muted" id="readtime"></p>
        <p class="muted" style="font-size:11px;">
          <strong>Shortcuts:</strong> Space = play/pause &middot; R = restart &middot; F = fullscreen
        </p>
      </div>
    </aside>

    <div class="controller-transport">
      <button id="restart">Restart</button>
      <button id="play-pause" class="primary">Play</button>
      <input id="scrub" class="scrub" type="range" min="0" max="1000" step="1" value="0" />
      <span id="time-elapsed" class="muted">0:00</span>
      <span class="muted">/</span>
      <span id="time-total" class="muted">0:00</span>
    </div>
  </div>

  <script type="module" src="/js/controller-view.js"></script>
</body>
</html>
